<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AXIOM · Mind-Controlled Streaming</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg:#0a0a0f; --surface:#141420; --card:#1a1a2e; --border:#2a2a40;
          --text:#e0e0f0; --dim:#6a6a8a; --accent:#e50914; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
         height:100vh; overflow:hidden; }

  .header { display:flex; align-items:center; justify-content:space-between;
            padding:14px 40px; background:linear-gradient(180deg,rgba(0,0,0,0.8),transparent);
            position:relative; z-index:20; }
  .logo { font-size:26px; font-weight:800; color:var(--accent); letter-spacing:2px; }
  .logo span { color:var(--text); font-weight:400; font-size:14px; margin-left:12px; }
  .header-right { display:flex; align-items:center; gap:14px; font-size:11px; color:var(--dim); }
  .eeg-bar { width:80px; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
  .eeg-fill { height:100%; background:#00ff88; border-radius:2px; transition:width 0.2s; }
  .dot { width:8px; height:8px; border-radius:50%; background:#ff4444; }
  .dot.on { background:#00ff88; box-shadow:0 0 6px #00ff8880; }

  /* ── Calibration ── */
  #calScreen { position:fixed; inset:0; z-index:100; background:var(--bg);
               display:flex; flex-direction:column; }
  #calScreen.done { display:none; }
  .cal-header { padding:20px 40px; text-align:center; }
  .cal-header h2 { font-size:18px; letter-spacing:2px; color:var(--accent); }
  .cal-header p { font-size:13px; color:var(--dim); margin-top:6px; }
  .cal-area { flex:1; position:relative; }
  .cal-dot {
    position:absolute; width:28px; height:28px; border-radius:50%;
    background:#1a1a2e; border:2px solid #5a6894;
    transform:translate(-50%,-50%); cursor:pointer;
    transition:all 0.2s; z-index:10;
  }
  .cal-dot:hover { border-color:#00d4ff; background:#00d4ff30; transform:translate(-50%,-50%) scale(1.2); }
  .cal-dot.done { background:#00ff88; border-color:#00ff88; opacity:0.5; pointer-events:none; }
  .cal-dot .cal-label {
    position:absolute; top:32px; left:50%; transform:translateX(-50%);
    font-size:9px; color:#4a4a6a; white-space:nowrap;
  }
  #calStatus { text-align:center; padding:12px; font-size:12px; color:var(--dim); }
  #calDone { display:none; margin:0 auto; padding:12px 36px; background:#00ff88;
             color:#000; border:none; border-radius:8px; font-family:'Inter';
             font-size:14px; font-weight:700; cursor:pointer; letter-spacing:1px; }

  /* ── Grid ── */
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; padding:0 40px; }
  .card { position:relative; border-radius:12px; overflow:hidden; aspect-ratio:16/10;
          background:var(--card); border:2px solid transparent;
          transition:transform 0.25s,border-color 0.3s,box-shadow 0.3s; cursor:pointer; }
  .card-gradient { position:absolute; bottom:0; left:0; right:0; height:65%;
                   background:linear-gradient(transparent,rgba(0,0,0,0.9)); }
  .card-info { position:absolute; bottom:0; left:0; right:0; padding:14px; }
  .card-title { font-size:14px; font-weight:700; margin-bottom:2px; }
  .card-meta { font-size:10px; color:var(--dim); }
  .card.pinned { border-color:rgba(255,255,255,0.3); transform:scale(1.04);
                 box-shadow:0 0 20px rgba(255,255,255,0.06); }
  .card.locked { border-color:var(--accent); transform:scale(1.06);
                 box-shadow:0 0 35px rgba(229,9,20,0.3); }
  .card.selected { border-color:#00ff88; transform:scale(1.08);
                   box-shadow:0 0 50px rgba(0,255,136,0.25); }

  .ring-box { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
              opacity:0; transition:opacity 0.2s; pointer-events:none; }
  .card.locked .ring-box { opacity:1; }
  .ring-bg { fill:none; stroke:rgba(255,255,255,0.1); stroke-width:3; }
  .ring-fg { fill:none; stroke:var(--accent); stroke-width:4; stroke-linecap:round;
             transform:rotate(-90deg); transform-origin:center; transition:stroke-dashoffset 0.1s; }
  .ring-pct { fill:white; font-size:14px; font-weight:700; font-family:'Inter';
              text-anchor:middle; dominant-baseline:central; }

  /* ── Player ── */
  #playerScreen { display:none; height:calc(100vh - 52px); flex-direction:column; background:#000; }
  #playerScreen.active { display:flex; }
  .player-video { flex:1; position:relative; }
  .player-video iframe { width:100%; height:100%; border:none; }
  .player-overlay { position:absolute; inset:0; background:linear-gradient(transparent 60%,rgba(0,0,0,0.7));
                    display:flex; flex-direction:column; justify-content:flex-end; padding:40px; }
  .player-title { font-size:28px; font-weight:800; margin-bottom:8px; }
  .player-meta { font-size:13px; color:var(--dim); }
  .player-controls { padding:14px 40px; background:var(--surface); display:flex;
                     align-items:center; gap:16px; border-top:1px solid var(--border); }
  .ctrl-btn { padding:10px 24px; border-radius:8px; border:none; font-family:'Inter';
              font-size:13px; font-weight:600; cursor:pointer; transition:all 0.2s; }
  .ctrl-btn.primary { background:var(--accent); color:white; }
  .ctrl-btn.secondary { background:var(--border); color:var(--text); }
  .ctrl-btn.pinned { transform:scale(1.05); box-shadow:0 0 15px rgba(255,255,255,0.1); }
  .ctrl-btn.locked { transform:scale(1.08); box-shadow:0 0 20px rgba(229,9,20,0.3); }

  /* ── Bottom ── */
  .bottom { position:fixed; bottom:0; left:0; right:0; z-index:20; }
  .narration { padding:8px 40px; background:rgba(20,20,32,0.95); border-top:1px solid #1a1a3e;
               font-size:11px; color:#6a6a8a; font-style:italic; }
  .np-bar { padding:10px 40px; background:var(--surface); border-top:1px solid var(--border);
            font-size:13px; font-weight:600; }

  .flash { position:fixed; inset:0; background:rgba(0,255,136,0.06); z-index:999;
           opacity:0; pointer-events:none; transition:opacity 0.3s; }
  .flash.active { opacity:1; }
</style>
</head>
<body>

<div class="flash" id="flash"></div>

<!-- ═══ CALIBRATION ═══ -->
<div id="calScreen">
  <div class="cal-header">
    <h2>GAZE CALIBRATION</h2>
    <p>Click each dot while looking directly at it. They're placed at the card positions.</p>
  </div>
  <div class="cal-area" id="calArea"></div>
  <div id="calStatus">0 points collected</div>
  <button id="calDone" onclick="finishCal()">START WATCHING</button>
</div>

<div class="header">
  <div class="logo">AXIOM<span>mind-controlled streaming</span></div>
  <div class="header-right">
    <span id="engLabel">--</span>
    <div class="eeg-bar"><div class="eeg-fill" id="eegFill" style="width:0"></div></div>
    <span id="actionCount">0</span>
    <div class="dot" id="statusDot"></div>
  </div>
</div>

<!-- ═══ BROWSE ═══ -->
<div id="browseScreen">
  <div style="padding:16px 40px 12px">
    <div style="font-size:14px;font-weight:600;color:var(--dim);letter-spacing:1px;text-transform:uppercase">Trending Now</div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- ═══ PLAYER ═══ -->
<div id="playerScreen">
  <div class="player-video" id="playerVideo"></div>
  <div class="player-controls" id="playerControls">
    <div class="ctrl-btn primary" id="btnPlay" data-action="play">▶ Play</div>
    <div class="ctrl-btn secondary" id="btnBack" data-action="back">← Back</div>
    <div style="margin-left:auto;font-size:11px;color:var(--dim)" id="playerEng">--</div>
  </div>
</div>

<div class="bottom">
  <div class="narration" id="narration">Open the page and calibrate to begin.</div>
  <div class="np-bar" id="npBar" style="color:#3a3a5a;font-style:italic">Nothing playing</div>
</div>

<script>
const CIRC = 2 * Math.PI * 28;
const MOVIES = [
  { id:"m1", title:"Neural Drift",    year:"2026", rating:"TV-MA", color:"#1a0a2e",
    video:"https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=0" },
  { id:"m2", title:"The Last Signal", year:"2025", rating:"PG-13", color:"#0a1a2e",
    video:"https://www.youtube.com/embed/jNQXAC9IVRw?autoplay=1&mute=1&controls=0" },
  { id:"m3", title:"Cortex",          year:"2026", rating:"R",     color:"#2e1a0a",
    video:"https://www.youtube.com/embed/LXb3EKWsInQ?autoplay=1&mute=1&controls=0" },
  { id:"m4", title:"Mind Gate",       year:"2024", rating:"TV-14", color:"#0a2e1a",
    video:"https://www.youtube.com/embed/ScMzIvxBSi4?autoplay=1&mute=1&controls=0" },
  { id:"m5", title:"Brainwave",       year:"2026", rating:"PG-13", color:"#2e0a1a",
    video:"https://www.youtube.com/embed/1La4QzGeaaQ?autoplay=1&mute=1&controls=0" },
  { id:"m6", title:"Synaptic",        year:"2025", rating:"TV-MA", color:"#1a2e0a",
    video:"https://www.youtube.com/embed/hHW1oY26kxQ?autoplay=1&mute=1&controls=0" },
  { id:"m7", title:"The Interface",   year:"2026", rating:"R",     color:"#0a0a2e",
    video:"https://www.youtube.com/embed/ZRCdORJiUgU?autoplay=1&mute=1&controls=0" },
  { id:"m8", title:"Echo Protocol",   year:"2024", rating:"TV-14", color:"#2e2e0a",
    video:"https://www.youtube.com/embed/d1YBv2mWll0?autoplay=1&mute=1&controls=0" },
];

let currentScreen = 'cal';
let currentMovie = null;
let isPlaying = false;
let calCount = 0;

// Build movie cards
const grid = document.getElementById('grid');
MOVIES.forEach(m => {
  const card = document.createElement('div');
  card.className = 'card'; card.id = m.id; card.dataset.title = m.title;
  card.innerHTML = `
    <div style="width:100%;height:100%;background:linear-gradient(135deg,${m.color},${m.color}dd,#0a0a15)"></div>
    <div class="card-gradient"></div>
    <div class="card-info"><div class="card-title">${m.title}</div><div class="card-meta">${m.year} · ${m.rating}</div></div>
    <div class="ring-box"><svg width="70" height="70" viewBox="0 0 70 70">
      <circle class="ring-bg" cx="35" cy="35" r="28"/>
      <circle class="ring-fg" cx="35" cy="35" r="28" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"/>
      <text class="ring-pct" x="35" y="35"></text>
    </svg></div>`;
  grid.appendChild(card);
});

// ── Calibration dots — placed at card centers + corners ──
function buildCalDots() {
  const area = document.getElementById('calArea');
  const dots = [];

  // 4 corners + center
  [[5,5],[95,5],[5,90],[95,90],[50,50]].forEach(([xp,yp], i) => {
    dots.push({ x: xp + '%', y: yp + '%', label: ['TL','TR','BL','BR','C'][i] });
  });

  // Card centers — after the grid has rendered
  setTimeout(() => {
    document.querySelectorAll('.card').forEach((card, i) => {
      const r = card.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const d = document.createElement('div');
      d.className = 'cal-dot';
      d.style.left = cx + 'px'; d.style.top = cy + 'px';
      d.innerHTML = `<span class="cal-label">${MOVIES[i].title}</span>`;
      d.onclick = () => calClick(d, cx, cy);
      area.appendChild(d);
    });
  }, 300);

  // Corner dots (percentage-based)
  dots.forEach(({x, y, label}) => {
    const d = document.createElement('div');
    d.className = 'cal-dot';
    d.style.left = x; d.style.top = y;
    d.innerHTML = `<span class="cal-label">${label}</span>`;
    d.onclick = function() {
      const r = this.getBoundingClientRect();
      calClick(this, r.left + r.width/2, r.top + r.height/2);
    };
    area.appendChild(d);
  });
}

function calClick(dot, viewX, viewY) {
  // Convert viewport to screen coordinates
  const screenX = viewX + window.screenX;
  const screenY = viewY + window.screenY + (window.outerHeight - window.innerHeight);

  dot.classList.add('done');

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'cal_point', screen_x: screenX, screen_y: screenY }));
  }
  calCount++;
  document.getElementById('calStatus').textContent = calCount + ' points collected';
  if (calCount >= 9) {
    document.getElementById('calDone').style.display = 'block';
  }
}

function finishCal() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'cal_done' }));
  }
}

function enterBrowse() {
  currentScreen = 'browse';
  document.getElementById('calScreen').classList.add('done');
  setTimeout(registerElements, 300);
}

// ── Element registration ──
function registerElements() {
  const elements = [];
  if (currentScreen === 'browse') {
    document.querySelectorAll('.card').forEach(card => {
      const r = card.getBoundingClientRect();
      elements.push({ id:card.id, label:card.dataset.title||card.id,
                       x:Math.round(r.left), y:Math.round(r.top),
                       w:Math.round(r.width), h:Math.round(r.height) });
    });
  } else if (currentScreen === 'player') {
    document.querySelectorAll('.ctrl-btn').forEach(btn => {
      const r = btn.getBoundingClientRect();
      elements.push({ id:btn.id, label:btn.dataset.action,
                       x:Math.round(r.left), y:Math.round(r.top),
                       w:Math.round(r.width), h:Math.round(r.height) });
    });
  }
  if (ws && ws.readyState === WebSocket.OPEN) {
    const ch = window.outerHeight - window.innerHeight;
    ws.send(JSON.stringify({ type:'register_elements', elements,
      window_x:window.screenX, window_y:window.screenY, chrome_height:ch }));
  }
}

// ── Player ──
function showPlayer(movie) {
  currentMovie = movie; currentScreen = 'player'; isPlaying = false;
  document.getElementById('browseScreen').style.display = 'none';
  document.getElementById('playerScreen').classList.add('active');
  document.getElementById('playerVideo').innerHTML = `
    <div class="player-overlay"><div class="player-title">${movie.title}</div>
    <div class="player-meta">${movie.year} · ${movie.rating} · 2h 14m</div></div>`;
  document.getElementById('playerVideo').style.background = `linear-gradient(135deg,${movie.color},#0a0a15)`;
  document.getElementById('btnPlay').textContent = '▶ Play';
  document.getElementById('npBar').textContent = `Selected: ${movie.title}`;
  document.getElementById('npBar').style.color = 'var(--text)';
  setTimeout(registerElements, 300);
}

function togglePlay() {
  const pv = document.getElementById('playerVideo');
  if (!isPlaying) {
    isPlaying = true;
    pv.innerHTML = `<iframe src="${currentMovie.video}" allow="autoplay;encrypted-media" allowfullscreen></iframe>`;
    document.getElementById('btnPlay').textContent = '⏸ Pause';
    document.getElementById('npBar').textContent = `▶ Playing: ${currentMovie.title}`;
  } else {
    isPlaying = false;
    pv.innerHTML = `<div class="player-overlay"><div class="player-title">${currentMovie.title}</div></div>`;
    pv.style.background = `linear-gradient(135deg,${currentMovie.color},#0a0a15)`;
    document.getElementById('btnPlay').textContent = '▶ Play';
    document.getElementById('npBar').textContent = `Paused: ${currentMovie.title}`;
  }
}

function backToBrowse() {
  currentScreen = 'browse'; currentMovie = null; isPlaying = false;
  document.getElementById('playerScreen').classList.remove('active');
  document.getElementById('browseScreen').style.display = '';
  document.getElementById('playerVideo').innerHTML = '';
  document.getElementById('npBar').innerHTML = '<span style="color:#3a3a5a;font-style:italic">Nothing playing</span>';
  setTimeout(registerElements, 300);
}

// ── WebSocket ──
let ws;
function connect() {
  ws = new WebSocket('ws://127.0.0.1:8091');
  ws.onopen = () => {
    document.getElementById('statusDot').classList.add('on');
    // Re-register on window move
    let lx = window.screenX, ly = window.screenY;
    setInterval(() => {
      if (window.screenX !== lx || window.screenY !== ly) {
        lx = window.screenX; ly = window.screenY;
        if (currentScreen !== 'cal') registerElements();
      }
    }, 1000);
  };
  ws.onclose = () => { document.getElementById('statusDot').classList.remove('on'); setTimeout(connect, 2000); };
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);

    if (d.type === 'init') {
      if (d.calibrated) enterBrowse();
      return;
    }
    if (d.type === 'cal_ack') return;
    if (d.type === 'cal_complete') { enterBrowse(); return; }
    if (d.type === 'cal_error') { alert(d.msg); return; }
    if (d.type !== 'state') return;

    // Header
    const eng = d.engagement;
    if (eng != null) {
      document.getElementById('engLabel').textContent = `${(eng*100).toFixed(0)}%`;
      document.getElementById('eegFill').style.width = (Math.min(eng,1)*100) + '%';
    }
    document.getElementById('actionCount').textContent = d.action_count;

    // Elements
    const allEls = currentScreen === 'browse' ? '.card' : '.ctrl-btn';
    document.querySelectorAll(allEls).forEach(el => {
      const s = d.elements[el.id];
      el.classList.remove('pinned', 'locked', 'selected');
      if (!s) return;
      if (s.pinned) {
        el.classList.add(s.confidence >= 0.55 ? 'locked' : 'pinned');
        const ring = el.querySelector('.ring-fg');
        const pct = el.querySelector('.ring-pct');
        if (ring) {
          ring.setAttribute('stroke-dashoffset', CIRC * (1 - Math.min(1, s.confidence / 0.75)));
          pct.textContent = Math.round(s.confidence * 100) + '%';
        }
      } else {
        const ring = el.querySelector('.ring-fg');
        const pct = el.querySelector('.ring-pct');
        if (ring) { ring.setAttribute('stroke-dashoffset', CIRC); pct.textContent = ''; }
      }
    });

    // Narration
    const narr = document.getElementById('narration');
    const top = Object.entries(d.elements||{}).sort((a,b) => b[1].confidence - a[1].confidence)[0];
    if (d.selected) {
      narr.textContent = 'Selected! ' + (d.engagement != null ? `Engagement: ${(d.engagement*100).toFixed(0)}%` : '');
      narr.style.color = '#00ff88';
    } else if (top && top[1].pinned) {
      const el = document.getElementById(top[0]);
      const name = el ? (el.dataset.title || el.dataset.action || top[0]) : top[0];
      narr.textContent = `Looking at "${name}" — ${Math.round(top[1].confidence*100)}% confidence`;
      narr.style.color = '#8888aa';
    } else {
      narr.textContent = currentScreen === 'browse' ? 'Look at a title to highlight it.' : 'Look at a control.';
      narr.style.color = '#6a6a8a';
    }

    // Selection
    if (d.selected) {
      document.getElementById('flash').classList.add('active');
      setTimeout(() => document.getElementById('flash').classList.remove('active'), 400);

      if (currentScreen === 'browse') {
        const card = document.getElementById(d.selected);
        if (card) { card.classList.add('selected'); setTimeout(() => card.classList.remove('selected'), 2000); }
        const movie = MOVIES.find(m => m.id === d.selected);
        if (movie) setTimeout(() => showPlayer(movie), 800);
      } else {
        if (d.selected === 'btnPlay') togglePlay();
        else if (d.selected === 'btnBack') backToBrowse();
      }
    }

    if (currentScreen === 'player' && eng != null) {
      document.getElementById('playerEng').textContent = `Focus: ${(eng*100).toFixed(0)}%`;
    }
  };
}

buildCalDots();
connect();
</script>
</body>
</html>
